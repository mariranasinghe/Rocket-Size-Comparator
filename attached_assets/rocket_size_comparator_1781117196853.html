
<style>
  .rc-wrap { padding: 1rem 0; }
  .rc-chip {
    padding: 5px 13px; border-radius: 99px; font-size: 12px; font-weight: 500;
    cursor: pointer; border: 1.5px solid; font-family: var(--font-sans);
    display: inline-flex; align-items: center; gap: 5px; transition: all 0.15s;
    user-select: none;
  }
  .rc-chip.on { color: #fff; }
  .rc-chip.off { opacity: 0.35; filter: grayscale(0.5); }
  .rc-stat {
    background: var(--color-background-primary);
    border: 0.5px solid var(--color-border-tertiary);
    border-radius: var(--border-radius-md);
    padding: 10px 12px;
  }
  .rc-stat-label { font-size: 11px; color: var(--color-text-tertiary); margin-bottom: 3px; }
  .rc-stat-val { font-size: 18px; font-weight: 500; color: var(--color-text-primary); }
  .rc-stat-name { font-size: 12px; color: var(--color-text-secondary); margin-top: 2px; }
  #rc-canvas { cursor: pointer; }
</style>

<div class="rc-wrap">
  <h2 class="sr-only">Rocket size comparator — rockets drawn to scale side by side</h2>
  <p style="font-size:22px;font-weight:500;color:var(--color-text-primary);margin:0 0 3px;">Rocket size comparator</p>
  <p style="font-size:14px;color:var(--color-text-secondary);margin:0 0 1rem;">Every rocket drawn to real scale. Toggle to compare up to 6.</p>

  <div id="chips" style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:1.25rem;"></div>

  <div style="border-radius:var(--border-radius-lg);overflow:hidden;border:0.5px solid #1e2535;">
    <canvas id="rc-canvas" style="display:block;width:100%;"></canvas>
  </div>

  <div id="rc-stats" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:9px;margin-top:1rem;"></div>
</div>

<script>
const ROCKETS = [
  { id:'starship',  name:'Starship',      agency:'SpaceX',     year:2023, h:121, d:9,    pay:150,  thr:74.0,  active:true,  color:'#5B8FCC', desc:'Tallest ever built. Fully reusable, targeting Mars.',     boosters:false },
  { id:'saturnv',   name:'Saturn V',      agency:'NASA',       year:1967, h:111, d:10.1, pay:140,  thr:35.1,  active:false, color:'#A0A09A', desc:'Sent 24 humans to the Moon. Most powerful until Starship.', boosters:false },
  { id:'newglenn',  name:'New Glenn',     agency:'Blue Origin', year:2025, h:98,  d:7,   pay:45,   thr:17.1,  active:true,  color:'#3D9E7A', desc:'Blue Origin heavy-lifter. Partially reusable.',           boosters:false },
  { id:'falconhvy', name:'Falcon Heavy',  agency:'SpaceX',     year:2018, h:70,  d:12.2, pay:63.8, thr:22.8,  active:true,  color:'#8A7FCC', desc:'Three Falcon 9 cores. Launched a Tesla into space.',      boosters:true  },
  { id:'falcon9',   name:'Falcon 9',      agency:'SpaceX',     year:2010, h:70,  d:3.7,  pay:22.8, thr:7.6,   active:true,  color:'#6B68B8', desc:'Most-flown rocket today. Pioneered booster reuse.',        boosters:false },
  { id:'ariane5',   name:'Ariane 5',      agency:'ESA',        year:1996, h:52,  d:5.4,  pay:21,   thr:13.2,  active:false, color:'#C0744A', desc:'Europe\'s workhorse for 27 years. Launched JWST.',         boosters:true  },
  { id:'soyuz',     name:'Soyuz-2',       agency:'Roscosmos',  year:1966, h:46,  d:2.95, pay:7.1,  thr:4.1,   active:true,  color:'#C9A030', desc:'Most-launched rocket in history. 60+ years of flights.',   boosters:false },
];

let selected = new Set(['starship','saturnv','falcon9']);

function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return {r,g,b};
}
function darken(hex, amt=0.25) {
  const {r,g,b} = hexToRgb(hex);
  return `rgb(${Math.round(r*(1-amt))},${Math.round(g*(1-amt))},${Math.round(b*(1-amt))})`;
}
function lighten(hex, amt=0.35) {
  const {r,g,b} = hexToRgb(hex);
  return `rgb(${Math.round(r+(255-r)*amt)},${Math.round(g+(255-g)*amt)},${Math.round(b+(255-b)*amt)})`;
}

function buildChips() {
  const el = document.getElementById('chips');
  el.innerHTML = '';
  ROCKETS.forEach(r => {
    const on = selected.has(r.id);
    const btn = document.createElement('button');
    btn.className = 'rc-chip ' + (on ? 'on' : 'off');
    btn.style.borderColor = r.color;
    if (on) btn.style.background = r.color;
    btn.innerHTML = `<span style="width:7px;height:7px;border-radius:50%;background:${on?'rgba(255,255,255,0.8)':r.color};flex-shrink:0;display:inline-block;"></span>${r.name}`;
    btn.onclick = () => {
      if (selected.has(r.id)) {
        if (selected.size > 1) selected.delete(r.id);
      } else {
        if (selected.size < 6) selected.add(r.id);
      }
      buildChips(); draw(); buildStats();
    };
    el.appendChild(btn);
  });
}

function buildStats() {
  const el = document.getElementById('rc-stats');
  const sel = ROCKETS.filter(r => selected.has(r.id)).sort((a,b) => b.h - a.h);
  el.innerHTML = sel.map(r => `
    <div class="rc-stat" style="border-top:2.5px solid ${r.color};">
      <div class="rc-stat-name" style="font-weight:500;color:var(--color-text-primary);margin-bottom:6px;">${r.name} <span style="font-size:11px;font-weight:400;color:var(--color-text-tertiary);">${r.year} · ${r.active?'active':'retired'}</span></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;">
        <div><div class="rc-stat-label">Height</div><div class="rc-stat-val">${r.h}<span style="font-size:12px;font-weight:400;color:var(--color-text-secondary);">m</span></div></div>
        <div><div class="rc-stat-label">Payload LEO</div><div class="rc-stat-val">${r.pay}<span style="font-size:12px;font-weight:400;color:var(--color-text-secondary);">t</span></div></div>
        <div><div class="rc-stat-label">Thrust</div><div class="rc-stat-val">${r.thr}<span style="font-size:12px;font-weight:400;color:var(--color-text-secondary);">MN</span></div></div>
        <div><div class="rc-stat-label">Agency</div><div class="rc-stat-val" style="font-size:13px;">${r.agency}</div></div>
      </div>
      <div style="font-size:11px;color:var(--color-text-tertiary);margin-top:7px;line-height:1.5;">${r.desc}</div>
    </div>`).join('');
}

function draw() {
  const cvs = document.getElementById('rc-canvas');
  const container = cvs.parentElement;
  const W = container.clientWidth || 640;
  const DPR = window.devicePixelRatio || 1;
  const H = Math.round(W * 0.72);
  cvs.width = W * DPR; cvs.height = H * DPR;
  cvs.style.width = W + 'px'; cvs.style.height = H + 'px';
  const ctx = cvs.getContext('2d');
  ctx.scale(DPR, DPR);

  // Background
  ctx.fillStyle = '#080D1A';
  ctx.fillRect(0, 0, W, H);

  // Stars
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  const starSeed = [23,97,134,211,45,178,303,56,289,412,67,198,345,89,267,423,112,376,501,234];
  starSeed.forEach((s,i) => {
    const sx = (s * 37 + i * 53) % (W - 60) + 45;
    const sy = (s * 19 + i * 31) % (H * 0.75);
    const sr = (i % 3 === 0) ? 1 : 0.6;
    ctx.beginPath(); ctx.arc(sx, sy, sr, 0, Math.PI*2); ctx.fill();
  });

  const RULER_W = 44;
  const PAD_B = 38;
  const PAD_T = 22;
  const drawH = H - PAD_B - PAD_T;
  const MAX_M = 135;
  const scale = drawH / MAX_M; // px per meter
  const groundY = H - PAD_B;

  // Grid lines & ruler
  ctx.font = `10px monospace`;
  ctx.textAlign = 'right';
  for (let m = 0; m <= MAX_M; m += 20) {
    const y = groundY - m * scale;
    ctx.strokeStyle = 'rgba(255,255,255,0.05)';
    ctx.lineWidth = 0.5;
    ctx.setLineDash([3,6]);
    ctx.beginPath(); ctx.moveTo(RULER_W + 2, y); ctx.lineTo(W - 10, y); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.fillText(m+'m', RULER_W - 4, y + 3.5);
    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.lineWidth = 0.5;
    ctx.beginPath(); ctx.moveTo(RULER_W - 3, y); ctx.lineTo(RULER_W + 1, y); ctx.stroke();
  }
  // Ruler line
  ctx.strokeStyle = 'rgba(255,255,255,0.2)';
  ctx.lineWidth = 0.5;
  ctx.beginPath(); ctx.moveTo(RULER_W, PAD_T); ctx.lineTo(RULER_W, groundY); ctx.stroke();

  // Ground line
  ctx.strokeStyle = 'rgba(255,255,255,0.2)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(RULER_W, groundY); ctx.lineTo(W - 10, groundY); ctx.stroke();

  // Person for scale (always shown, far right)
  const personH = 1.8 * scale;
  const personX = W - 18;
  ctx.strokeStyle = 'rgba(255,255,255,0.4)';
  ctx.lineWidth = 1;
  // body
  ctx.beginPath(); ctx.moveTo(personX, groundY); ctx.lineTo(personX, groundY - personH * 0.55); ctx.stroke();
  // head
  ctx.beginPath(); ctx.arc(personX, groundY - personH * 0.55 - personH * 0.15, personH * 0.13, 0, Math.PI*2); ctx.stroke();
  // arms
  ctx.beginPath(); ctx.moveTo(personX - personH*0.15, groundY - personH*0.45); ctx.lineTo(personX + personH*0.15, groundY - personH*0.45); ctx.stroke();
  // legs
  ctx.beginPath(); ctx.moveTo(personX, groundY - personH*0.15); ctx.lineTo(personX - personH*0.1, groundY); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(personX, groundY - personH*0.15); ctx.lineTo(personX + personH*0.1, groundY); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.3)'; ctx.font = '9px monospace'; ctx.textAlign = 'center';
  ctx.fillText('1.8m', personX, groundY + 12);

  // Draw rockets
  const sel = ROCKETS.filter(r => selected.has(r.id));
  const availW = W - RULER_W - 35; // leave space for person
  const colW = availW / sel.length;

  sel.forEach((r, i) => {
    const cx = RULER_W + colW * i + colW / 2;
    const rH = r.h * scale;

    // Width: base on diameter but with min/max for visual clarity
    const baseW = Math.max(22, Math.min(r.d * scale * 2.2, colW * 0.55));

    if (r.boosters) {
      // Side boosters
      const bH = rH * 0.58;
      const bW = baseW * 0.3;
      const bOff = baseW * 0.62;
      drawRocketShape(ctx, cx - bOff, groundY, bH, bW, darken(r.color, 0.2), false);
      drawRocketShape(ctx, cx + bOff, groundY, bH, bW, darken(r.color, 0.2), false);
    }
    drawRocketShape(ctx, cx, groundY, rH, baseW, r.color, true);

    // Name label below
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.font = `500 11px var(--font-sans, sans-serif)`;
    ctx.fillText(r.name, cx, groundY + 14);
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.font = `10px monospace`;
    ctx.fillText(r.h + 'm', cx, groundY + 26);
  });
}

function drawRocketShape(ctx, cx, groundY, hPx, wPx, color, addDetail) {
  const hw = wPx / 2;
  const noseH = hPx * 0.14;
  const engineH = hPx * 0.10;
  const flare = hw * 0.22;
  const finW = hw * 0.7;
  const finTop = groundY - hPx * 0.22;
  const topY = groundY - hPx;
  const noseEndY = topY + noseH;
  const bodyEndY = groundY - engineH;

  // Fins
  ctx.fillStyle = darken(color, 0.3);
  [[cx - hw, cx - hw - finW], [cx + hw, cx + hw + finW]].forEach(([attach, tip]) => {
    ctx.beginPath();
    ctx.moveTo(attach, finTop);
    ctx.lineTo(tip, groundY);
    ctx.lineTo(attach, groundY);
    ctx.closePath();
    ctx.fill();
  });

  // Main body
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(cx, topY);
  ctx.quadraticCurveTo(cx + hw * 0.25, topY + noseH * 0.25, cx + hw, noseEndY);
  ctx.lineTo(cx + hw, bodyEndY);
  ctx.lineTo(cx + hw + flare, groundY);
  ctx.lineTo(cx - hw - flare, groundY);
  ctx.lineTo(cx - hw, bodyEndY);
  ctx.lineTo(cx - hw, noseEndY);
  ctx.quadraticCurveTo(cx - hw * 0.25, topY + noseH * 0.25, cx, topY);
  ctx.closePath();
  ctx.fill();

  if (addDetail && hPx > 40) {
    // Stage line
    ctx.strokeStyle = 'rgba(0,0,0,0.25)';
    ctx.lineWidth = 1;
    ctx.setLineDash([]);
    const sY = topY + hPx * 0.42;
    ctx.beginPath(); ctx.moveTo(cx - hw + 1, sY); ctx.lineTo(cx + hw - 1, sY); ctx.stroke();

    // Highlight
    ctx.fillStyle = 'rgba(255,255,255,0.14)';
    const sW = Math.max(2, hw * 0.14);
    ctx.fillRect(cx - hw + 2, noseEndY + 3, sW, bodyEndY - noseEndY - 6);
  }

  // Engine nozzle
  ctx.fillStyle = '#0a0a14';
  const nzR = hw * 0.48;
  ctx.beginPath(); ctx.ellipse(cx, groundY, nzR, nzR * 0.3, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#1a1a28';
  ctx.beginPath(); ctx.ellipse(cx, groundY, nzR * 0.55, nzR * 0.17, 0, 0, Math.PI*2); ctx.fill();
}

buildChips();
draw();
buildStats();
window.addEventListener('resize', () => { draw(); });
</script>
